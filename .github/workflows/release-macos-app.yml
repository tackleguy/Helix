name: Release macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Helix.app zip
        run: npm run build:app

      - name: Copy zip for static hosting
        run: mkdir -p public/downloads && cp dist/Helix-macOS-arm64.zip public/downloads/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Helix-macOS-arm64
          path: dist/Helix-macOS-arm64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Helix-macOS-arm64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
